<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AroundTownSound — Owner inbox</title><style>body{background:#09090c;color:#fff;font:16px system-ui;margin:0;padding:24px;max-width:950px;margin:auto}h1{font-size:32px}a{color:#ffc36a}article{background:#19151b;border:1px solid #49343d;border-radius:12px;padding:20px;margin:18px 0}p{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bbb}button{background:#ed2e3b;color:white;border:0;border-radius:8px;padding:12px;font:inherit}#status{color:#ffc36a}.email{white-space:normal}</style><a href="/">← Website</a><h1>Owner order inbox</h1><p>Only your signed-in owner account can view these requests. Cash App payments must be checked separately.</p><button id="refresh">Refresh requests</button><p id="status" role="status">Loading requests…</p><main id="orders"></main><script>async function load(){const status=document.getElementById('status');status.textContent='Loading requests…';try{const r=await fetch('/api/orders',{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error);document.getElementById('orders').replaceChildren();status.textContent=data.orders.length?data.orders.length+' recent request(s)':'No requests yet.';for(const o of data.orders){const card=document.createElement('article');const h=document.createElement('h2');h.textContent=o.customer+' — '+o.service;card.append(h);const meta=document.createElement('small');meta.textContent=new Date(o.created_at).toLocaleString()+' · Ref '+o.id;card.append(meta);const email=document.createElement('p');email.className='email';const link=document.createElement('a');link.href='mailto:'+encodeURIComponent(o.email);link.textContent=o.email;email.append(link);card.append(email);for(const text of ['Style: '+o.genre,'Preferred date: '+(o.preferred_date||'Flexible'),o.brief]){const p=document.createElement('p');p.textContent=text;card.append(p)}document.getElementById('orders').append(card)}}catch(e){status.textContent=e.message||'Could not load requests.'}}document.getElementById('refresh').onclick=load;load();</script></html>
